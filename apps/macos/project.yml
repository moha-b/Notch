name: Notch
options:
  bundleIdPrefix: io.github.moha-b
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    ENABLE_HARDENED_RUNTIME: "YES"
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"

targets:
  Notch:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: Sparkle
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Notch
        CFBundleDisplayName: Notch Preview
        NotchChannel: development
        LSMinimumSystemVersion: "15.0"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        SUFeedURL: https://moha-b.github.io/Notch/updates/macos.xml
        SUPublicEDKey: ""
        SUEnableAutomaticChecks: false
        SUAutomaticallyUpdate: false
        SUAllowsAutomaticUpdates: false
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.moha-b.notch.preview
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  NotchTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Notch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.moha-b.notch.preview.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Notch:
    build:
      targets:
        Notch: all
        NotchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NotchTests
